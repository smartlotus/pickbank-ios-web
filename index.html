<!doctype html>
<html lang="zh-Hans" data-edition="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F2EC" />
    <meta
      name="description"
      content="PickBank 拾念记账 原生 Swift 6 + SwiftUI iOS/iPadOS 应用程序产品规格书与交互预览沙盒（非 WebApp）。忠实还原移植自 Android v1.9.2，零费用免签装机。"
    />

    <!-- Synchronous FOUC prevention before first paint -->
    <script>
      (function () {
        try {
          var e = localStorage.getItem('pickbank_edition_v3');
          if (e === 'paper' || e === 'carbon' || e === 'hermes') {
            document.documentElement.dataset.edition = e;
            var tc = document.querySelector('meta[name="theme-color"]');
            if (tc) {
              tc.setAttribute(
                'content',
                e === 'hermes' ? '#0018E6' : e === 'carbon' ? '#0C0C0B' : '#F4F2EC'
              );
            }
          }
          var l = localStorage.getItem('pickbank_lang_v2');
          if (l === 'en' || l === 'zh') {
            document.documentElement.lang = l === 'zh' ? 'zh-Hans' : 'en';
          }
        } catch (_) {}
      })();
    </script>

    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link
      rel="preload"
      href="/assets/fusion-pixel-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>PICKBANK · 拾念记账 原生 iOS/iPadOS App 规格书</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
